<head>
<meta charset="utf-8">

<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d2228;--muted:#6a717a;--line:#e4e1da;--accent:#0f5c4c;--up:#1d7a46;--down:#b3372b}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1a1d21;--ink:#e7e9ec;--muted:#959ca5;--line:#2a2e34;--accent:#5fc3a7;--up:#5cc489;--down:#f07b6e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Charter,"Iowan Old Style",Georgia,serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.brand{font:700 14px/1.2 -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-decoration:none}
header nav a{font:500 14px -apple-system,system-ui,sans-serif;color:var(--muted);text-decoration:none;margin-left:14px}
h1{font-size:30px;line-height:1.2;margin:4px 0 2px}
.meta{font:14px -apple-system,system-ui,sans-serif;color:var(--muted);margin-bottom:20px}
h2{font:700 13px/1.3 -apple-system,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
p,li{margin:0 0 12px}
ul{padding-left:20px}
a{color:var(--accent)}
.src{font:13px -apple-system,system-ui,sans-serif;color:var(--muted);white-space:nowrap}
.src a{color:var(--muted)}
.src::before{content:" "}
.src+.src::before{content:" · "}
.mkt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:-apple-system,system-ui,sans-serif}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .c{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.pager{display:flex;justify-content:space-between;margin-top:40px;font:15px -apple-system,system-ui,sans-serif}
.archive li{list-style:none;padding:10px 0;border-bottom:1px solid var(--line)}
.archive{padding:0}
.h2note{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-left:6px}
.cal{width:100%;border-collapse:collapse;font:14px/1.4 -apple-system,system-ui,sans-serif;margin-bottom:8px}
.cal td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.cal .t{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);width:1%}
.cal .r{white-space:nowrap;color:var(--muted);width:1%;padding-right:10px}
.cal .dec td{font-weight:650}
.cal .fp{font-size:12px;color:var(--muted);font-weight:400}
.pod{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 18px;font-family:-apple-system,system-ui,sans-serif}
.pod-l{font-size:14px;font-weight:600;margin-bottom:6px}
.pod audio{width:100%}
.pod-s{font-size:13px;margin-top:4px}
.foot{margin-top:40px;font:12px -apple-system,system-ui,sans-serif;color:var(--muted)}
</style>
</head>
